services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: skill, POSTGRES_PASSWORD: skill, POSTGRES_DB: skill}
    command: postgres -c shared_buffers=1GB -c work_mem=64MB -c max_wal_size=4GB
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://skill:skill@db/skill
      API_KEY: change-me
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [db]
    ports: ["8000:8000"]
volumes: {pgdata: {}}
