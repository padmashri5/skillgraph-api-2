<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillGraph</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e2e5ea;--ac:#4f46e5;--ok:#16a34a;--wn:#d97706;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8eaf0;--mu:#9099a8;--bd:#2a303c;--ac:#818cf8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 20px;max-width:1150px;margin:auto}h1{margin:0;font-size:20px}h1 span{color:var(--ac)}
nav{display:flex;gap:4px;max-width:1150px;margin:auto;padding:0 20px;border-bottom:1px solid var(--bd);overflow-x:auto}nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mu);font:inherit;cursor:pointer}nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:1150px;margin:auto;padding:16px 20px 60px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.n{font-size:26px;font-weight:700}.l{color:var(--mu);font-size:12px}h3{margin:14px 0 6px;font-size:14px}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit}textarea{width:100%;min-height:56px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}button.b.r{background:var(--bad)}button.b.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%}.tag{padding:1px 8px;border-radius:99px;color:#fff;font-size:12px}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--bd);padding:18px;overflow-y:auto;transform:translateX(105%);transition:.2s;z-index:5;box-shadow:-4px 0 18px rgba(0,0,0,.15)}#panel.open{transform:none}
.x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer}.sr{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--bd)}.rw{cursor:pointer;padding:4px 0;display:grid;grid-template-columns:1fr 110px 44px;gap:8px;align-items:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90%}
</style></head><body>
<header><h1>Skill<span>Graph</span></h1><div class="row" style="margin:0"><input id="key" type="password" placeholder="API key" style="width:170px"><button class="b" onclick="setKey()">Connect</button></div></header>
<nav id="nav"></nav><main id="m"></main><aside id="panel"></aside><div id="toast"></div>
<script>
const LV=["None","Aware","Basic","Proficient","Advanced","Expert"],$=s=>document.querySelector(s),m=$("#m"),P=$("#panel");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=v=>v>=85?"var(--ok)":v>=60?"var(--wn)":"var(--bad)",bar=(v,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%;background:${c||col(v)}"></i></div>`;
let KEY=localStorage.getItem("sg_key")||"",SK=[],SKM={},ROLES=[],tab="Dashboard",DIRTY={};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000)}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{"Content-Type":"application/json","X-API-Key":KEY}});
 if(!r.ok){let t=r.statusText;try{const j=await r.json();t=typeof j.detail=="string"?j.detail:JSON.stringify(j.detail)}catch{}toast(r.status+": "+t);throw new Error(t)}return r.status==204?null:r.json()}
const get=p=>api(p),send=(p,method,b)=>api(p,{method,body:b===undefined?undefined:JSON.stringify(b)});
function setKey(){KEY=$("#key").value;localStorage.setItem("sg_key",KEY);boot()}
async function loadRoles(){ROLES=[];let a=0;for(;;){const r=await get("/roles?limit=500&after="+a);ROLES.push(...r);if(r.length<500)break;a=r[r.length-1].id}}
async function boot(){$("#key").value=KEY;if(!KEY){m.innerHTML='<div class="c">Enter your API key above to connect.</div>';nav();return}
 try{SK=await get("/skills");SK.forEach(s=>SKM[s.id]=s.name);await loadRoles();show(tab)}catch(e){m.innerHTML='<div class="c">Could not connect. Check the API key.</div>'}}
const TABS={Dashboard:dash,Employees:()=>emps(true),Roles:roles,Succession:succ,Staffing:staff,Learning:learn,Skills:skills,Reports:reports};
function nav(){$("#nav").innerHTML=Object.keys(TABS).map(t=>`<button class="${t==tab?"on":""}" onclick="show('${t}')">${t}</button>`).join("")}
async function show(t){tab=t;nav();closeP();await TABS[t]()}
// ---------- dashboard ----------
async function dash(){const[s,pl]=await Promise.all([get("/analytics/summary"),get("/analytics/workforce-plan")]);
 m.innerHTML=`<div class="g">${[["Employees",s.employees],["Roles",s.roles],["Skills",s.skills],["Skill ratings",s.ratings]].map(([a,b])=>`<div class="c"><div class="n">${b.toLocaleString()}</div><div class="l">${a}</div></div>`).join("")}</div>
 <div class="c"><h3 style="margin-top:0">Workforce plan: people at level 3+ vs demand</h3><div class="w"><table><tr><th>Skill</th><th>Supply</th><th>Target</th><th>Coverage</th><th>Upskill pool</th><th>Action</th></tr>
 ${pl.map(x=>{const cv=x.demand?Math.round(x.supply/x.demand*100):100;return`<tr><td>${esc(x.skill)}</td><td>${x.supply.toLocaleString()}</td><td><input type="number" min="0" value="${x.demand}" style="width:90px" onchange="setDem(${x.skill_id},this.value)"></td><td>${bar(cv)}</td><td>${x.upskill_pool.toLocaleString()}</td><td>${esc(x.action)}</td></tr>`}).join("")}</table></div><div class="l">Set a target headcount per skill to get build-or-hire recommendations.</div></div>${await contRisk()}`}
async function setDem(id,v){await send(`/demand/${id}?target_headcount=${+v||0}`,"PUT");dash()}
// ---------- employees ----------
let EM={after:0,dept:"",rows:[],next:null};
async function emps(reset){if(reset){EM.after=0;EM.rows=[]}
 const r=await get(`/employees?limit=50&after=${EM.after}`+(EM.dept?`&department=${encodeURIComponent(EM.dept)}`:""));EM.rows.push(...r.items);EM.next=r.next_after;
 m.innerHTML=`<div class="c"><div class="row"><input id="df" placeholder="Filter by department" value="${esc(EM.dept)}" onkeydown="if(event.key=='Enter'){EM.dept=this.value;emps(true)}"><button class="b s" onclick="EM.dept=$('#df').value;emps(true)">Filter</button></div>
 <div class="row"><input id="ne" placeholder="Employee ID" style="width:120px"><input id="nn" placeholder="Name"><input id="nd" placeholder="Department"><button class="b" onclick="addEmp()">Add employee</button></div></div>
 <div class="c"><div class="w"><table><tr><th>ID</th><th>Name</th><th>Department</th></tr>${EM.rows.map(e=>`<tr class="cl" onclick="openEmp(${e.id})"><td>${esc(e.external_id)}</td><td>${esc(e.name)}</td><td>${esc(e.department)}</td></tr>`).join("")||'<tr><td colspan=3 class="l">No employees yet.</td></tr>'}</table></div>
 ${EM.next?`<p><button class="b s" onclick="EM.after=${EM.next};emps(false)">Load more</button></p>`:""}</div>`}
async function addEmp(){const e=$("#ne").value.trim(),n=$("#nn").value.trim();if(!e||!n)return toast("ID and name are required");
 await send("/employees/bulk","POST",[{external_id:e,name:n,department:$("#nd").value.trim()||null}]);toast("Employee saved");emps(true)}
function closeP(){P.classList.remove("open")}
async function openEmp(id){const[e,top,hist]=await Promise.all([get("/employees/"+id),get(`/employees/${id}/top-roles?limit=5`),get(`/employees/${id}/assessments?limit=8`)]);
 DIRTY={};const cur={};e.ratings.forEach(r=>cur[r.skill_id]=r.level);
 P.innerHTML=`<button class="x" onclick="closeP()">×</button><h2 style="margin:0">${esc(e.name)}</h2><div class="l">${esc(e.external_id)} · ${esc(e.department||"")}</div><div class="row" style="margin-top:6px"><label class="l">Availability % <input type="number" min="0" max="100" value="${e.availability}" style="width:70px" onchange="send('/employees/${id}/availability?value='+(+this.value||0),'PUT')"></label></div>
 <h3>Best-fit roles</h3>${top.map(t=>`<div class="rw" onclick="gap(${id},${t.role_id})"><span>${esc(t.name)}</span>${bar(t.score)}<b>${t.score}%</b></div>`).join("")||'<div class="l">No scores yet. Add skill ratings.</div>'}
 <h3>Gap analysis for a role</h3><div class="row"><select id="gr">${ROLES.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select><button class="b s" onclick="gap(${id},+$('#gr').value)">Analyse</button><button class="b" onclick="devPlan(${id})">Development plan</button><label class="l"><input type="checkbox" id="aiplan"> AI coaching</label></div><div id="gap"></div>
 <h3>Skill proficiency</h3><input placeholder="Filter skills" oninput="const q=this.value.toLowerCase();document.querySelectorAll('.sr').forEach(r=>r.style.display=r.dataset.n.includes(q)?'':'none')" style="width:100%;margin-bottom:6px">
 <div style="max-height:260px;overflow:auto">${SK.map(s=>`<div class="sr" data-n="${esc(s.name.toLowerCase())}"><span>${esc(s.name)}</span><select onchange="DIRTY[${s.id}]=+this.value">${LV.map((n,i)=>`<option value="${i}" ${(cur[s.id]||0)==i?"selected":""}>${i} ${n}</option>`).join("")}</select></div>`).join("")}</div>
 <p><button class="b" onclick="saveR(${id})">Save ratings</button></p>
 <h3>AI assessment</h3><div class="row"><select id="as">${SK.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><button class="b" id="sq" onclick="startQ(${id})">Start assessment</button></div><div id="qa"></div>
 <h3>Extract skills from text (resume, notes)</h3><textarea id="xt" placeholder="Paste a resume, profile or project summary"></textarea><div class="row"><button class="b s" onclick="extract(${id},false)">Preview</button><button class="b" onclick="extract(${id},true)">Extract &amp; save</button></div><div id="xr"></div>
 <h3>History</h3>${hist.map(h=>`<div class="l" style="margin-bottom:4px">${esc(h.at.slice(0,10))} · <b>${esc(SKM[h.skill_id])}</b> · L${h.level} · ${esc(h.source)}${h.summary?" · "+esc(h.summary):""}</div>`).join("")||'<div class="l">None yet.</div>'}`;
 P.classList.add("open")}
async function gap(id,rid){const g=await get(`/employees/${id}/readiness/${rid}`);$("#gap").innerHTML=`<p><b>${g.score==null?"Not scored yet":g.score+"% ready"}</b>${g.total_est_hours?` · ≈ ${g.total_est_hours} learning hours`:""}</p>`+(g.gaps.length?`<table><tr><th>Skill</th><th>Now</th><th>Need</th><th>Hours</th></tr>${g.gaps.map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.have}</td><td>${x.need}</td><td>${x.est_hours}</td></tr>`).join("")}</table>`:'<div class="l">No gaps.</div>')}
async function saveR(id){const rows=Object.entries(DIRTY).map(([k,v])=>({skill_id:+k,level:v,confidence:.7,source:"manual"}));if(!rows.length)return toast("No changes");await send(`/employees/${id}/ratings`,"PUT",rows);toast("Ratings saved");openEmp(id)}
async function startQ(id){const b=$("#sq");b.disabled=true;b.textContent="Generating…";try{const s=+$("#as").value,qs=await get(`/skills/${s}/questions`);
 $("#qa").innerHTML=qs.map(q=>`<p><b>Level ${q.level}</b><br>${esc(q.question)}</p><textarea data-q="${q.id}"></textarea>`).join("")+`<p><button class="b" id="gb" onclick="grade(${id},${s})">Submit for AI grading</button></p><div id="gres"></div>`}finally{b.disabled=false;b.textContent="Start assessment"}}
async function grade(id,s){const b=$("#gb");b.disabled=true;b.textContent="Grading…";try{const answers=[...document.querySelectorAll("#qa textarea")].map(t=>({question_id:+t.dataset.q,answer:t.value}));
 const r=await send(`/employees/${id}/assessments`,"POST",{skill_id:s,answers});$("#gres").innerHTML=`<div class="c"><b>Level ${r.level} · ${LV[r.level]}</b> · score ${r.score} · confidence ${Math.round(r.confidence*100)}%<br>${esc(r.summary)}<br><span class="l">Saved to profile. Role scores update now.</span></div>`;b.style.display="none"}catch(e){b.disabled=false;b.textContent="Submit for AI grading"}}
// ---------- roles ----------
function editor(id,cur={}){return`<input placeholder="Filter skills" oninput="const q=this.value.toLowerCase();document.querySelectorAll('#${id} .sr').forEach(r=>r.style.display=r.dataset.n.includes(q)?'':'none')" style="width:100%;margin:6px 0"><div id="${id}" style="max-height:240px;overflow:auto">${SK.map(s=>`<div class="sr" data-n="${esc(s.name.toLowerCase())}"><span>${esc(s.name)}</span><select data-s="${s.id}" data-w="${cur[s.id]?.weight||1}">${LV.map((n,i)=>`<option value="${i}" ${(cur[s.id]?.level||0)==i?"selected":""}>${i==0?"Not required":i+" "+n}</option>`).join("")}</select></div>`).join("")}</div>`}
const collect=id=>[...document.querySelectorAll(`#${id} select`)].filter(s=>+s.value>0).map(s=>({skill_id:+s.dataset.s,level:+s.value,weight:+s.dataset.w}));
async function roles(){await loadRoles();m.innerHTML=`<div class="c"><h3 style="margin-top:0">Create a role</h3><input id="rn" placeholder="Role name" style="width:260px">${editor("rnew")}<p><button class="b" onclick="addRole()">Create role</button></p></div>
 ${ROLES.map(r=>`<div class="c"><div class="row" style="justify-content:space-between;margin:0"><div><b>${esc(r.name)}</b> <span class="l">v${r.version}</span>${r.is_critical?' <span class="tag" style="background:var(--bad)">Critical</span>':""}</div><div class="row" style="margin:0"><button class="b s" onclick="editRole(${r.id})">Edit requirements</button><button class="b s" onclick="cand(${r.id},true)">Candidates</button><button class="b s" onclick="crit(${r.id},${!r.is_critical})">${r.is_critical?"Unmark critical":"Mark critical"}</button><button class="b r" onclick="delRole(${r.id})">Delete</button></div></div><div id="re${r.id}"></div></div>`).join("")}<div id="cand"></div>`}
async function addRole(){const name=$("#rn").value.trim();if(!name)return toast("Name required");await send("/roles","POST",{name,requirements:collect("rnew")});toast("Role created. Readiness is being calculated.");roles()}
async function editRole(id){const r=await get("/roles/"+id),cur={};r.requirements.forEach(q=>cur[q.skill_id]=q);$("#re"+id).innerHTML=editor("ed"+id,cur)+`<p><button class="b" onclick="saveRole(${id})">Save requirements</button></p>`}
async function saveRole(id){await send(`/roles/${id}/requirements`,"PUT",collect("ed"+id));toast("Saved. Scores are recalculating in the background.");roles()}
async function delRole(id){if(confirm("Delete this role and its readiness scores?")){await send("/roles/"+id,"DELETE");roles()}}
let CD={rows:[]};
async function cand(id,reset){if(reset)CD={role:id,cursor:null,rows:[],min:CD.min||0};const r=await get(`/roles/${id}/candidates?limit=25&min_score=${CD.min}`+(CD.cursor?`&cursor=${CD.cursor}`:""));CD.rows.push(...r.items);CD.cursor=r.next_cursor;
 $("#cand").innerHTML=`<div class="c"><h3 style="margin-top:0">Best-fit candidates · ${esc(ROLES.find(x=>x.id==id)?.name)}</h3><div class="row"><label class="l">Min score <input type="number" min="0" max="100" value="${CD.min}" style="width:70px" onchange="CD.min=+this.value;cand(${id},true)"></label></div>
 <div class="w"><table><tr><th>Name</th><th>Department</th><th>Readiness</th><th>Gaps</th></tr>${CD.rows.map(x=>`<tr class="cl" onclick="openEmp(${x.employee_id})"><td>${esc(x.name)}</td><td>${esc(x.department)}</td><td>${bar(x.score)}<span class="l">${x.score}%</span></td><td>${x.gap_count}</td></tr>`).join("")||'<tr><td colspan=4 class="l">No scored candidates yet.</td></tr>'}</table></div>${CD.cursor?`<p><button class="b s" onclick="cand(${id},false)">Load more</button></p>`:""}</div>`;$("#cand").scrollIntoView({behavior:"smooth"})}
// ---------- skills ----------
async function skills(){SK=await get("/skills");SK.forEach(s=>SKM[s.id]=s.name);
 m.innerHTML=`<div class="c"><div class="row"><input id="sn" placeholder="Skill name"><input id="sc" placeholder="Category"><button class="b" onclick="addSkill()">Add skill</button></div></div><div class="c"><div class="w"><table><tr><th>ID</th><th>Skill</th><th>Category</th></tr>${SK.map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.category)}</td></tr>`).join("")}</table></div></div>`}
async function addSkill(){const n=$("#sn").value.trim();if(!n)return;await send("/skills","POST",{name:n,category:$("#sc").value.trim()||null});toast("Skill added");skills()}
// ---------- solution additions ----------
async function contRisk(){const c=await get("/analytics/continuity-risks");
 return`<div class="c"><h3 style="margin-top:0">Business continuity risks</h3>${c.roles_at_risk.map(r=>`<div>⚠ <b>${esc(r.role)}</b>: ${r.ready_now} ready-now successor(s) for ${r.incumbents} incumbent(s) · <span class="tag" style="background:${r.risk=="high"?"var(--bad)":"var(--wn)"}">${r.risk}</span></div>`).join("")}
 ${c.skills_at_risk.length?`<div class="w"><table><tr><th>Skill with few proficient people</th><th>Holders (L3+)</th><th>Target</th></tr>${c.skills_at_risk.map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.holders}</td><td>${x.demand}</td></tr>`).join("")}</table></div>`:""}
 ${!c.roles_at_risk.length&&!c.skills_at_risk.length?'<div class="l">No continuity risks detected. Mark critical roles and set skill targets to monitor them.</div>':""}</div>`}
async function crit(id,v){await send(`/roles/${id}/critical?value=${v}`,"PUT");roles()}
async function devPlan(id){const rid=+$("#gr").value,d=await get(`/employees/${id}/development-plan/${rid}?ai=${$("#aiplan").checked}`);
 $("#gap").innerHTML=`<p><b>${d.score==null?"Not scored":d.score+"% ready"}</b> · ${d.total_hours} learning hours</p>`+(d.steps.map(s=>`<div class="c" style="padding:8px"><b>${esc(s.skill)}</b> <span class="l">L${s.have} → L${s.need}</span>${s.resources.map(r=>`<div>• ${esc(r.title)} <span class="l">${esc(r.provider||"")} · ${r.hours}h → L${r.level}</span>${r.url?` <a href="${esc(r.url)}" target="_blank" rel="noopener">open</a>`:""}</div>`).join("")||`<div class="l">No catalog course yet · est. ${s.est_hours}h</div>`}</div>`).join("")||'<div class="l">No gaps. Ready now.</div>')+(d.coaching?`<div class="c" style="padding:8px;white-space:pre-wrap">${esc(d.coaching)}</div>`:"")}
async function extract(id,apply){const t=$("#xt").value;if(!t.trim())return toast("Paste some text first");$("#xr").textContent="Analysing…";
 try{const r=await send(`/employees/${id}/extract-skills`,"POST",{text:t,apply});$("#xr").innerHTML=r.found.map(f=>`<div class="l">${esc(SKM[f.skill_id])} · L${f.level} · ${Math.round(f.confidence*100)}% · “${esc(f.evidence)}”</div>`).join("")||"No catalog skills found.";if(apply){toast(`Saved ${r.applied} skills`)}}catch(e){$("#xr").textContent=""}}
const RK=r=>r=="high"?"var(--bad)":r=="medium"?"var(--wn)":"var(--ok)";
async function succ(){const r=await get("/succession");m.innerHTML=r.length?r.map(x=>`<div class="c"><div class="row" style="justify-content:space-between;margin:0"><div><b>${esc(x.role)}</b> <span class="tag" style="background:${RK(x.risk)}">${x.risk} risk</span><div class="l">${x.incumbents} incumbents · ${x.ready_now} ready now · ${x.ready_soon} ready in 1–2 yrs · ${x.developing} developing</div></div><button class="b s" onclick="succDetail(${x.role_id})">View bench</button></div></div>`).join("")+'<div id="sd"></div>':'<div class="c">No critical roles yet. Mark roles as critical on the Roles tab.</div>'}
async function succDetail(id){const d=await get("/succession/"+id);$("#sd").innerHTML=`<div class="c"><h3 style="margin-top:0">${esc(d.role)}: succession bench</h3><div class="l">Incumbents: ${d.incumbent_list.map(i=>esc(i.name)).join(", ")||"none"}</div>`+[["ready_now","Ready now (85%+)"],["ready_soon","Ready in 1–2 years (65–84%)"],["developing","Developing (40–64%)"]].map(([k,t])=>`<h3>${t} · ${d.bands[k].count}</h3>${d.bands[k].top.map(p=>`<div class="rw" onclick="openEmp(${p.employee_id})"><span>${esc(p.name)} <span class="l">${esc(p.department||"")}</span></span>${bar(p.score)}<b>${p.score}%</b></div>`).join("")||'<div class="l">None</div>'}`).join("")+"</div>";$("#sd").scrollIntoView({behavior:"smooth"})}
async function staff(){const ps=await get("/projects");m.innerHTML=`<div class="c"><h3 style="margin-top:0">New project / demand</h3><input id="pn" placeholder="Project name" style="width:260px">${editor("pnew")}<p><button class="b" onclick="addProj()">Create project</button></p></div>`+ps.map(p=>`<div class="c row" style="justify-content:space-between"><b>${esc(p.name)}</b><span><label class="l">Min availability % <input type="number" id="ma${p.id}" value="0" min="0" max="100" style="width:64px"></label> <button class="b s" onclick="staffing(${p.id})">Find best-fit staff</button></span></div>`).join("")+'<div id="st"></div>'}
async function addProj(){const name=$("#pn").value.trim(),sk=collect("pnew");if(!name||!sk.length)return toast("Name and at least one skill required");await send("/projects","POST",{name,skills:sk});toast("Project created");staff()}
async function staffing(id){const r=await get(`/projects/${id}/staffing?limit=25&min_available=${+$("#ma"+id).value||0}`);$("#st").innerHTML=`<div class="c"><div class="w"><table><tr><th>Name</th><th>Department</th><th>Skill fit</th><th>Covers</th><th>Available</th></tr>${r.items.map(x=>`<tr class="cl" onclick="openEmp(${x.employee_id})"><td>${esc(x.name)}</td><td>${esc(x.department)}</td><td>${bar(x.score)}<span class="l">${x.score}%</span></td><td>${x.skills_covered}/${r.skills_required}</td><td>${x.availability}%</td></tr>`).join("")||'<tr><td colspan=5 class="l">No matching people.</td></tr>'}</table></div></div>`}
async function learn(){const l=await get("/learning?limit=300");m.innerHTML=`<div class="c"><h3 style="margin-top:0">Add learning resource</h3><div class="row"><select id="ls">${SK.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><input id="lt" placeholder="Course title"><input id="lp" placeholder="Provider" style="width:130px"><select id="ll">${[1,2,3,4,5].map(i=>`<option value="${i}">Takes learner to L${i}</option>`).join("")}</select><input id="lh" type="number" placeholder="Hours" style="width:80px"><input id="lu" placeholder="https://…"><button class="b" onclick="addRes()">Add</button></div></div><div class="c w"><table><tr><th>Skill</th><th>Course</th><th>Provider</th><th>To level</th><th>Hours</th></tr>${l.map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</td><td>${esc(x.provider)}</td><td>L${x.level}</td><td>${x.hours}</td></tr>`).join("")}</table></div>`}
async function addRes(){const t=$("#lt").value.trim(),h=+$("#lh").value;if(!t||!h)return toast("Title and hours required");await send("/learning","POST",{skill_id:+$("#ls").value,title:t,provider:$("#lp").value||null,level:+$("#ll").value,hours:h,url:$("#lu").value.trim()||null});toast("Added");learn()}
async function dl(path,name){const r=await fetch(path,{headers:{"X-API-Key":KEY}});if(!r.ok)return toast("Download failed: "+r.status);const u=URL.createObjectURL(await r.blob()),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function reports(){m.innerHTML=`<div class="c"><h3 style="margin-top:0">Reports (CSV, ready for Excel/BI)</h3><div class="row"><button class="b s" onclick="dl('/reports/skill-matrix.csv','skill-matrix.csv')">Skill inventory (all employees)</button><button class="b s" onclick="dl('/reports/workforce-plan.csv','workforce-plan.csv')">Workforce plan</button><button class="b s" onclick="dl('/reports/succession.csv','succession.csv')">Succession bench</button></div><div class="row"><select id="rr">${ROLES.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select><button class="b s" onclick="dl('/reports/role-readiness.csv?role_id='+$('#rr').value,'role-readiness.csv')">Role readiness for selected role</button></div></div>`}
boot();
</script></body></html>
